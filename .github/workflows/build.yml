name: Build RJ-Scheduler APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip and find the project
        run: |
          rm -rf build-src && mkdir build-src
          for Z in *.zip; do
            [ -f "$Z" ] || continue
            echo "Unzipping $Z"
            unzip -q -o "$Z" -d build-src
          done
          SG=$(find build-src . -name settings.gradle -not -path '*/.git/*' 2>/dev/null | head -1)
          if [ -z "$SG" ]; then
            echo "::error::No Android project found. Upload the project zip (it must contain settings.gradle) to the top of the repository."
            exit 1
          fi
          PROJ=$(dirname "$SG")
          echo "Project folder: $PROJ"
          chmod +x "$PROJ/gradlew"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJ"
          ./gradlew assembleDebug --no-daemon

      - name: Sign with Paul's key (if the key secrets are set up)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJ"
          OUT=app/build/outputs/apk/debug
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing key secrets found. The APK uses GitHub's TEMPORARY key."
            cp $OUT/app-debug.apk "$GITHUB_WORKSPACE/apk-out/RJ-Scheduler-TEMP-KEY.apk"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > rj.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks rj.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/apk-out/RJ-Scheduler.apk" $OUT/app-debug.apk
          rm -f rj.jks
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/apk-out/RJ-Scheduler.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RJ-Scheduler-apk
          path: apk-out/*.apk
          if-no-files-found: error
